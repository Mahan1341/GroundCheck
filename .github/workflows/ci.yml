name: offline-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[dev]'
      - name: Offline tests including splits, masking, freeze, bootstrap and leakage regressions
        run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m pip check
      - run: python -m grounded_hallucination_lab.cli baseline --data-dir tests/fixtures --output reports/ci-fixture.json
